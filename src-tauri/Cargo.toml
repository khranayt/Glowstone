[package]
name = "glowstone"
version = "0.1.0"
description = "Glowstone — a local-first Markdown knowledge base"
authors = ["Glowstone contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/glowstone-app/glowstone"

[lib]
name = "glowstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
base64 = "0.22"
notify = "8"
mime_guess = "2"
html2md = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[patch.crates-io]
html2md = { path = "vendor/html2md" }
